name: Bug report
description: Something in Meh does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Meh did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a PNG file\n2. Press Ctrl+R\n3. ..."
  - type: textarea
    id: info
    attributes:
      label: Version info
      description: In Meh, open About and click Copy Info, then paste it here.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or files
      description: Optional. Do not attach images that you do not want to be public.